name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        run: npm install --prefix client
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Install root development tools
        run: npm install
      - name: Validate static HTML with W3C Nu
        run: node scripts/validate-w3c.mjs
      - name: Build the client
        run: npm run build
      - name: Run tests
        run: npm test
